name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Test mock API
        run: |
          cd backend
          npm ci
          npm test
      - name: Verify frontend
        run: |
          cd frontend
          npm ci
          npm test
          npm run lint
          npm run build
